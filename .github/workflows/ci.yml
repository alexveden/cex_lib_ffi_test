name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap cex
        run: cc cex.c -o cex
      - name: native tests
        run: ./cex test run all
      - name: build library
        run: ./cex build-lib

  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: bootstrap cex
        run: cc cex.c -o cex
      - name: bindings
        run: bash run_bindings.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap cex
        run: cc cex.c -o cex
      - name: native tests
        run: ./cex test run all
      - name: build library
        run: ./cex build-lib

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
      - name: bootstrap cex
        run: cc cex.c -o cex
      - name: native tests
        run: ./cex test run all
      - name: build library
        run: ./cex build-lib
