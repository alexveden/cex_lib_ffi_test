name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: lua toolchain
        run: sudo apt-get update && sudo apt-get install -y luajit libluajit-5.1-dev
      - name: bootstrap cex
        run: cc cex.c -o cex
      - name: native tests
        run: ./cex test run all
      - name: build library
        run: ./cex build-lib
      - name: bindings
        run: ./cex bindings all

  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: lua toolchain
        run: brew install luajit pkgconf
      - name: bootstrap cex
        run: cc cex.c -o cex
      - name: native tests
        run: ./cex test run all
      - name: build library
        run: ./cex build-lib
      - name: bindings
        run: ARCHFLAGS="-arch $(uname -m)" ./cex bindings all

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-cffi
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-cython
            mingw-w64-ucrt-x86_64-luajit
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: bootstrap cex
        run: gcc cex.c -o cex
      - name: native tests
        run: ./cex test run all
      - name: build library
        run: ./cex build-lib
      - name: bindings
        run: ./cex bindings all
